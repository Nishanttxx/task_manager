org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
android.useAndroidX=true
# Disable Kotlin incremental compilation to avoid cross-drive path errors on Windows
# (project on D: drive vs Pub Cache on C: drive causes IllegalArgumentException)
kotlin.incremental=false
